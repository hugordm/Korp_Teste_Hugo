<!-- Barra de navegação fixa no topo. Por enquanto só exibe o título do
     sistema; a estrutura (flex + gap) já deixa espaço pronto para no futuro
     receber links de navegação (ex: Produtos | Notas Fiscais) ao lado do
     título, sem precisar refazer o layout. -->
<header class="sticky top-0 z-20 border-b border-gray-200 bg-white">
  <div class="mx-auto flex max-w-5xl items-center gap-6 px-6 py-4">
    <h1 class="text-lg font-semibold text-gray-900 sm:text-xl">KORP - Sistema de Notas Fiscais</h1>
  </div>
</header>

<!-- router-outlet é o "espaço reservado" no template onde o Angular injeta
     dinamicamente o componente correspondente à rota atual (definida em
     app.routes.ts). Quando a URL muda (ex: de '/produtos' para
     '/produtos/novo'), o Angular remove o componente antigo daqui e renderiza
     o novo no mesmo lugar — sem essa tag, nenhuma rota apareceria na tela. -->
<router-outlet />
