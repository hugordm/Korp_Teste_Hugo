<!-- Barra de navegação fixa no topo: título do sistema + links entre as
     telas principais (Produtos e Notas Fiscais). -->
<header class="sticky top-0 z-20 border-b border-gray-200 bg-white">
  <div class="mx-auto flex max-w-5xl items-center gap-6 px-6 py-4">
    <h1 class="text-lg font-semibold text-gray-900 sm:text-xl">KORP - Sistema de Notas Fiscais</h1>

    <!-- routerLinkActive aplica automaticamente uma classe CSS ao elemento
         quando a rota associada ao routerLink daquele link está ativa (ou
         seja, quando a URL atual corresponde a ela) — sem precisar comparar
         a URL manualmente no componente. Aqui usamos isso para destacar em
         negrito/indigo o link da tela em que o usuário está no momento,
         reforçando visualmente onde ele se encontra na navegação. -->
    <!-- cursor-pointer explícito nos dois links: apesar de <a href> já
         ganhar o cursor de mãozinha por padrão do navegador, mantemos a
         classe aqui também por consistência com o resto do app (onde ela é
         obrigatória para <button> e outros elementos clicáveis, que não
         ganham a mãozinha sozinhos). -->
    <nav class="flex items-center gap-4 text-sm font-medium">
      <a
        routerLink="/produtos"
        routerLinkActive="text-indigo-600"
        class="cursor-pointer text-gray-600 transition-colors hover:text-gray-900"
      >
        Produtos
      </a>
      <a
        routerLink="/notas"
        routerLinkActive="text-indigo-600"
        class="cursor-pointer text-gray-600 transition-colors hover:text-gray-900"
      >
        Notas Fiscais
      </a>
    </nav>
  </div>
</header>

<!-- router-outlet é o "espaço reservado" no template onde o Angular injeta
     dinamicamente o componente correspondente à rota atual (definida em
     app.routes.ts). Quando a URL muda (ex: de '/produtos' para
     '/produtos/novo'), o Angular remove o componente antigo daqui e renderiza
     o novo no mesmo lugar — sem essa tag, nenhuma rota apareceria na tela. -->
<router-outlet />

<!-- Chat flutuante opcional/bônus: fica fora do router-outlet de propósito,
     para renderizar uma única vez e permanecer visível em todas as páginas,
     independente da rota atual. -->
<app-chat-widget />
